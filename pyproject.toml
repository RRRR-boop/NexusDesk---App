[project]
name = "nexusdesk"
version = "0.2.1b3"
description = "Boîte à outils Windows 11 locale, gratuite et sans télémétrie"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "GPL-3.0-only"
license-files = ["LICENSE"]

dependencies = [
    "pyside6>=6.8,<7",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2,<3",
    "pywin32>=306; sys_platform == 'win32'",
    "psutil>=5.9,<7",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.6,<7",
    "ruff>=0.6,<1",
    "mypy>=1.10,<2",
    "pytest>=9.0.3,<10",
    "pytest-qt>=4.4,<5",
    "pytest-cov>=5.0,<6",
    "hypothesis>=6.100,<7",
    "import-linter>=2.0,<3",
    "pre-commit>=3.7,<4",
    "pip-audit>=2.7,<3",
    "pip-licenses>=4.4,<5",
    "types-pywin32>=306; sys_platform == 'win32'",
    "types-psutil>=5.9,<8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexusdesk"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "N"]
# N818 : les noms d'erreurs (DependencyMissing, PermissionDenied, Timeout, Cancelled) sont
# imposés tels quels par le cahier des charges (section 4), sans suffixe "Error".
ignore = ["N818"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
explicit_package_bases = true
exclude = ["^src/nexusdesk/database/migrations/"]

# types-pywin32 fournit les stubs pour win32api, win32event, win32pipe, etc.

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: tests nécessitant un vrai environnement Windows",
    "ui: tests d'interface pytest-qt",
]
qt_api = "pyside6"

[tool.coverage.run]
source = ["src/nexusdesk"]
omit = ["src/nexusdesk/database/migrations/*"]

[tool.importlinter]
root_package = "nexusdesk"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "ui ne doit jamais importer integrations ou database"
type = "forbidden"
# allow_indirect_imports : le cahier des charges interdit les imports directs d'une couche
# vers une autre ; passer par la couche intermédiaire autorisée (ex. ui -> viewmodels ->
# services -> repositories -> database) est le fonctionnement normal de l'architecture en
# couches, pas une violation.
allow_indirect_imports = true
source_modules = ["nexusdesk.ui"]
forbidden_modules = ["nexusdesk.integrations", "nexusdesk.database"]

[[tool.importlinter.contracts]]
name = "viewmodels ne doit jamais importer ui ou integrations"
type = "forbidden"
# allow_indirect_imports : le cahier des charges interdit les imports directs d'une couche
# vers une autre ; passer par la couche intermédiaire autorisée (ex. ui -> viewmodels ->
# services -> repositories -> database) est le fonctionnement normal de l'architecture en
# couches, pas une violation.
allow_indirect_imports = true
source_modules = ["nexusdesk.viewmodels"]
forbidden_modules = ["nexusdesk.ui", "nexusdesk.integrations"]

[[tool.importlinter.contracts]]
name = "services ne doit jamais importer ui, Qt ou integrations directement"
type = "forbidden"
# allow_indirect_imports : le cahier des charges interdit les imports directs d'une couche
# vers une autre ; passer par la couche intermédiaire autorisée (ex. ui -> viewmodels ->
# services -> repositories -> database) est le fonctionnement normal de l'architecture en
# couches, pas une violation.
allow_indirect_imports = true
source_modules = ["nexusdesk.services"]
forbidden_modules = ["nexusdesk.ui", "PySide6", "nexusdesk.integrations"]

[[tool.importlinter.contracts]]
name = "repositories et database ne doivent jamais importer services ou ui"
type = "forbidden"
# allow_indirect_imports : le cahier des charges interdit les imports directs d'une couche
# vers une autre ; passer par la couche intermédiaire autorisée (ex. ui -> viewmodels ->
# services -> repositories -> database) est le fonctionnement normal de l'architecture en
# couches, pas une violation.
allow_indirect_imports = true
source_modules = ["nexusdesk.repositories", "nexusdesk.database"]
forbidden_modules = ["nexusdesk.services", "nexusdesk.ui"]

[[tool.importlinter.contracts]]
name = "integrations ne doit jamais importer services ou ui"
type = "forbidden"
# allow_indirect_imports : le cahier des charges interdit les imports directs d'une couche
# vers une autre ; passer par la couche intermédiaire autorisée (ex. ui -> viewmodels ->
# services -> repositories -> database) est le fonctionnement normal de l'architecture en
# couches, pas une violation.
allow_indirect_imports = true
source_modules = ["nexusdesk.integrations"]
forbidden_modules = ["nexusdesk.services", "nexusdesk.ui"]
