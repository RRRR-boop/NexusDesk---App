repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff (lint)
        entry: uv run ruff check --fix
        language: system
        types: [python]

      - id: ruff-format
        name: Ruff (format)
        entry: uv run ruff format
        language: system
        types: [python]

      - id: mypy
        name: mypy --strict
        entry: uv run mypy src
        language: system
        pass_filenames: false
        types: [python]

      - id: import-linter
        name: import-linter (règles de couches)
        entry: uv run lint-imports
        language: system
        pass_filenames: false
        types: [python]
